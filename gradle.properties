org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# zstd-jni 1.5.7-13 以降は compileSdk 37 を要求する（Android 17 の 16KB ページ互換判定に
# 合格し RELRO も保つ版を使うため）。AGP 8.13 は 36.1 までの検証だが、ビルドと動作は確認済み
android.suppressUnsupportedCompileSdk=37.0
